[tool.black]
line-length = 100
target-version = ['py310']
extend-exclude = '''
/(
  # directories
  \.git
  | __pycache__
  | \.venv
  | venv
  | env
  | model_cache
  | outputs
  | reference_audio
  | voices
  | ui
  | static
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["dia", "config", "engine", "utils", "models"]

[tool.pylint.messages_control]
max-line-length = 100
disable = [
    "C0103",  # Invalid name (we use our naming conventions)
    "C0114",  # Missing module docstring
    "C0115",  # Missing class docstring
    "C0116",  # Missing function docstring
    "R0902",  # Too many instance attributes
    "R0913",  # Too many arguments
    "R0914",  # Too many local variables
    "R0915",  # Too many statements
    "W0212",  # Access to protected member (intentional in some cases)
    "W0511",  # TODO/FIXME comments (we want these)
]

[tool.pylint.basic]
good-names = ["i", "j", "k", "e", "f", "sr", "db", "id", "ui"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
